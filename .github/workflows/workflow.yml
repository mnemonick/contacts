name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    name: Building
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: main
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Sender
      - name: Validate sender
        run: bunx tsc
        working-directory: sender

      - name: Lint sender
        run: bunx biome check
        working-directory: sender

      - name: Start sender
        run: bun sender/sender.ts &

      - name: Wait for sender
        run: bunx wait-on tcp:5000 --timeout 10000

      # Frontend
      - name: Validate frontend
        run: bunx tsc
        working-directory: frontend

      - name: Lint frontend
        run: bunx biome check
        working-directory: frontend

      - name: Build frontend
        run: bunx vite build --mode=production
        working-directory: frontend

      # Backend
      - name: Validate backend
        run: bunx tsc
        working-directory: backend

      - name: Lint backend
        run: bunx biome check
        working-directory: backend

      - name: Start backend
        run: bun backend/backend.ts &

      - name: Wait for backend
        run: bunx wait-on tcp:5001 --timeout 10000

      # Tests
      - name: Validate tests
        run: bunx tsc
        working-directory: tests

      - name: Lint tests
        run: bunx biome check
        working-directory: tests

      - name: Restore Playwright Browsers
        uses: actions/cache/restore@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('./bun.lock') }}

      - name: Install Playwright System Dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
        working-directory: tests

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
        working-directory: tests

      - name: Save Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('./bun.lock') }}

      - name: Run tests
        run: bunx playwright test --forbid-only --retries=1 --reporter=github,list
        working-directory: tests

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/test-results
          retention-days: 7

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /root/contacts
            git fetch -q origin
            git reset -q --hard ${{ github.sha }}
            bun install --frozen-lockfile --production
            cd frontend
            bunx vite build --mode=production
            systemctl restart backend.contacts
            systemctl restart sender.contacts
