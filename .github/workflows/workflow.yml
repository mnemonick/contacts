name: CI/CD

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    name: Building
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: main
          # The backend connects without a password, as in local development.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # The full history is fetched so gitleaks scans every commit, not only the last one.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # args.ts and secrets.ts are in git with development values; a production secret committed by mistake fails the build.
      - name: Scan for secrets
        run: bun run gitleaks

      - name: Check types
        run: bun run validate

      - name: Lint and check formatting
        run: bun run check

      - name: Build frontend
        run: bun run --filter frontend build

      # Servers run in the background; "wait" blocks until their port accepts connections.
      - name: Start backend
        run: bun run --filter backend start &

      - name: Wait for backend
        run: bun run --filter backend wait

      - name: Start sender
        run: bun run --filter sender start &

      - name: Wait for sender
        run: bun run --filter sender wait

      - name: Restore Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('./bun.lock') }}

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
        working-directory: tests

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
        working-directory: tests

      # --forbid-only fails on a forgotten test.only; the github reporter annotates failures in the PR.
      - name: E2E
        run: bun run --filter tests test --forbid-only --retries=1 --reporter=github,list

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/test-results
          retention-days: 7
